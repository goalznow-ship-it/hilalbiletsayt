name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  node:
    name: Install, typecheck, lint, unit + API e2e, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: hilal
          POSTGRES_PASSWORD: hilal
          POSTGRES_DB: hilal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hilal -d hilal_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://hilal:hilal@localhost:5432/hilal_test
      TEST_DATABASE_URL: postgresql://hilal:hilal@localhost:5432/hilal_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      QR_SIGNING_SECRET: ci-qr-secret-ci-qr-secret-ci-qr-secret-00
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Migrations apply cleanly and match the schema
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: API unit tests
        run: pnpm --filter @hilal/api test
      - name: API e2e tests (isolated database)
        run: pnpm --filter @hilal/api test:e2e
      - name: Web unit tests
        run: pnpm --filter @hilal/web test
      - name: Build
        run: pnpm build

  omr:
    name: OMR worker tests (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/omr-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/omr-worker/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Production dependencies (blocking at high)
        run: pnpm audit --prod --audit-level=high
      - name: All dependencies (report only)
        run: pnpm audit || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OMR worker dependencies (blocking)
        run: |
          pip install pip-audit
          pip-audit -r services/omr-worker/requirements.txt

  stack:
    name: Docker build, production stack, load test, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [node, omr]
    steps:
      - uses: actions/checkout@v4
      - name: Environment for a disposable stack
        run: |
          cp .env.example .env
          ./scripts/generate-secrets.sh .env
          # All test traffic comes from one address; raise the per-IP limits.
          sed -i 's/^API_RATE_LIMIT_PER_MINUTE=.*/API_RATE_LIMIT_PER_MINUTE=100000/; s/^AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=.*/AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=1000/; s/^BOOTSTRAP_ADMIN_EMAIL=.*/BOOTSTRAP_ADMIN_EMAIL=admin@ci.test/' .env
      - name: Docker build
        run: docker compose --profile production build
      - name: Start production profile and wait for health
        run: docker compose --profile production up -d --wait --wait-timeout 300
      - name: Stack status
        if: always()
        run: docker compose --profile production ps
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hilal/e2e
      - name: Concurrent sales load test (no oversell, no duplicates)
        run: |
          set -a; . ./.env; set +a
          API_URL=http://localhost ADMIN_EMAIL=admin@ci.test ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" \
            pnpm --filter @hilal/e2e load
      - name: Playwright smoke + accessibility
        run: |
          set -a; . ./.env; set +a
          pnpm --filter @hilal/e2e exec playwright install --with-deps chromium
          BASE_URL=http://localhost ADMIN_EMAIL=admin@ci.test ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" \
            pnpm --filter @hilal/e2e smoke
      - name: Backup / restore drill
        run: ./scripts/backup-restore-drill.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Logs on failure
        if: failure()
        run: docker compose --profile production logs --tail 200
