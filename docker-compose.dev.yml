# Local development helpers: publish database and service ports on localhost.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres worker
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
  worker:
    ports: ["127.0.0.1:${WORKER_PORT:-8000}:8000"]
  api:
    ports: ["127.0.0.1:${API_PORT:-3001}:3001"]
  web:
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
