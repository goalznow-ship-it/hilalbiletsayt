# Hilal Bilet Sistemi — full stack.
#
#   cp .env.example .env && ./scripts/generate-secrets.sh .env
#   docker compose --profile production up -d --build
#
# Only the `proxy` service (profile "production") publishes ports. Everything
# else talks over the private compose network. Secrets have no defaults: the
# stack refuses to start until they are set (see .env.example).
name: hilal

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hilal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hilal}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Reserved for queues/caching; the application does not use it yet.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies Prisma migrations, then exits 0. The API waits for it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: hilal-api:${IMAGE_TAG:-local}
    restart: "no"
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hilal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hilal}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: hilal-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hilal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hilal}
      CORS_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      # Client IPs arrive via proxy -> web -> api on private networks only.
      API_TRUSTED_PROXIES: loopback,uniquelocal
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
      AUTH_LOGIN_RATE_LIMIT_PER_MINUTE: ${AUTH_LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?Set QR_SIGNING_SECRET in .env}
      OMR_WORKER_URL: http://worker:8000
      OMR_WORKER_SECRET: ${OMR_WORKER_SECRET:?Set OMR_WORKER_SECRET in .env}
      OMR_STORAGE_DIR: /var/lib/hilal/omr
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_BRANCH_CODE: ${BOOTSTRAP_BRANCH_CODE:-MERKEZ}
      BOOTSTRAP_BRANCH_NAME: ${BOOTSTRAP_BRANCH_NAME:-Mərkəzi ofis}
    volumes:
      - omr_data:/var/lib/hilal/omr
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>r.json()).then(b=>process.exit(b.database==='connected'?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./services/omr-worker
      dockerfile: Dockerfile
    image: hilal-omr-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      OMR_WORKER_SECRET: ${OMR_WORKER_SECRET:?Set OMR_WORKER_SECRET in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: hilal-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # TLS-terminating reverse proxy; the only service with published ports.
  # SITE_ADDRESS=bilet.example.az enables automatic Let's Encrypt certificates;
  # SITE_ADDRESS=:80 serves plain HTTP (local verification only).
  proxy:
    image: caddy:2.8.4-alpine
    profiles: ["production"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  omr_data:
  caddy_data:
  caddy_config:
