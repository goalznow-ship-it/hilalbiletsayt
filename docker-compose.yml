services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hilal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hilal}
      POSTGRES_DB: ${POSTGRES_DB:-hilal}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hilal} -d ${POSTGRES_DB:-hilal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal networking only - port not published to host
    # To publish for local dev: add - "${REDIS_PORT:-6379}:6379" above
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set credentials in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set credentials in .env}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hilal}:${POSTGRES_PASSWORD:-hilal}@postgres:5432/${POSTGRES_DB:-hilal}
      POSTGRES_USER: ${POSTGRES_USER:-hilal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hilal}
      POSTGRES_DB: ${POSTGRES_DB:-hilal}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-your-very-secure-secret-at-least-32-characters-long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OMR_STORAGE_DIR: ${OMR_STORAGE_DIR:-var/omr}
      OMR_STORAGE_DRIVER: ${OMR_STORAGE_DRIVER:-local}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-hilal-omr}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      OMR_WORKER_URL: http://worker:8000
      OMR_WORKER_SECRET: ${OMR_WORKER_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => process.exit(0)) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./services/omr-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: 1
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      OMR_WORKER_URL: http://worker:8000
      OMR_WORKER_SECRET: ${OMR_WORKER_SECRET}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-hilal-omr}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_ORIGIN: http://api:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
